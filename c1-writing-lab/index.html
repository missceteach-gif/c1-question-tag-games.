<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>C1.2 Writing Lab · Miss C</title><style>
:root{--ink:#1e2940;--muted:#637089;--bg:#f4f6fb;--blue:#3658d4;--line:#dfe5f1;--good:#126b50}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 system-ui,-apple-system,Segoe UI,sans-serif}header{background:#17244b;color:white;padding:35px max(22px,calc((100vw - 1040px)/2))}header h1{font-size:clamp(30px,5vw,52px);line-height:1.12;margin:8px 0}header p{color:#d7dfff}.eyebrow{text-transform:uppercase;letter-spacing:.15em;font-size:12px;font-weight:800}main{max-width:1080px;margin:auto;padding:24px 18px 70px}.tabs{display:flex;gap:9px;overflow:auto;padding:5px 0 20px}.tabs button{white-space:nowrap}.panel{background:white;border:1px solid var(--line);border-radius:20px;padding:clamp(20px,4vw,36px);box-shadow:0 10px 25px #24325c0b;margin-bottom:20px}button,select{font:inherit}button{cursor:pointer;border:1px solid #cbd5eb;background:white;color:var(--ink);padding:11px 16px;border-radius:11px;font-weight:700}button.active,.primary{background:var(--blue);color:white;border-color:var(--blue)}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #8eaeff}h2{font-size:clamp(24px,3vw,34px);line-height:1.2;margin:0 0 10px}h3{font-size:21px;margin:0 0 10px}p{margin:8px 0 18px}.muted{color:var(--muted)}.pill{display:inline-block;border-radius:30px;background:#e9edff;color:#324bb0;font-size:13px;font-weight:800;padding:5px 12px;margin:4px 0 14px}.steps{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}.steps button{font-size:14px}.exercise{background:#f8faff;border:1px solid var(--line);border-radius:15px;padding:20px;margin:16px 0}.exercise label{display:block;font-weight:650;margin:12px 0 6px}select,input,textarea{width:100%;border:1px solid #cbd5e5;border-radius:10px;background:white;padding:13px;font-size:17px;color:var(--ink)}textarea{min-height:220px;resize:vertical}.feedback{padding:14px;border-radius:10px;margin-top:12px;background:#e8f5ee;color:#15563e}.incorrect{background:#fff0ed;color:#8d3227}.model{border-left:4px solid #5b70d7;padding:12px 18px;background:#f3f5ff;border-radius:6px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.small{font-size:14px}.progress{height:9px;background:#e4e8f3;border-radius:9px;overflow:hidden}.progress span{display:block;height:100%;background:#5276df;transition:width .2s}.footer{color:#69748c;text-align:center;font-size:13px;padding:30px}@media(max-width:600px){.panel{padding:19px}button{padding:12px}body{font-size:16px}}</style></head><body>
<header><div class="eyebrow">MISS C · ENGLISH PRACTICE</div><h1>C1.2 Writing Lab</h1><p>Six genres. Real communicative choices. Guided practice with instant, explained feedback.</p></header>
<main><div class="tabs" id="genres"></div><section class="panel"><span class="pill" id="register"></span><h2 id="heading"></h2><p class="muted" id="intro"></p><div class="progress"><span id="bar"></span></div><div class="steps" id="steps"></div><div id="content" aria-live="polite"></div></section><div class="footer">Based on Functional Language Banks – C1 Advanced · Independent study and classroom use · No account required</div></main>
<script>
const genres=[["Essay","Formal · objective","The issue of remote working has generated considerable debate.","This essay will examine whether remote working benefits employees and employers.",["introducing","arguments","contrasting","concluding"],["The issue of … has generated considerable debate.","One of the main arguments in favour of … is …","However, it could also be argued that …","Overall, the evidence suggests that …"],"Should universities make attendance compulsory? Discuss both sides and reach a reasoned conclusion."],["Proposal","Semi-formal · persuasive","The aim of this proposal is to improve student wellbeing.","It is recommended that the college introduce quiet study spaces.",["purpose","problem","suggestion","justification"],["The aim of this proposal is to …","One of the main problems concerns …","One possible solution would be to …","This would have the benefit of …"],"Your language school wants to improve student engagement. Write a proposal to the director."],["Report","Neutral · evidence-based","The purpose of this report is to assess the library facilities.","According to the information gathered, students would welcome longer opening hours.",["purpose","findings","drawbacks","recommendations"],["The purpose of this report is to assess …","According to the information gathered, …","A major concern relates to …","Steps should be taken to …"],"Write a report evaluating facilities at your language school, using plausible findings."],["Formal letter","Formal · purposeful","I am writing to express my concern about the proposed closure.","I would appreciate it if you could reconsider the decision.",["opening","complaint","source critique","request"],["I am writing with regard to …","I find it unacceptable that …","This statement fails to consider …","I would appreciate it if you could …"],"Write to the editor responding to an article claiming adult language education is unnecessary."],["Informal email","Friendly · conversational","You'll never guess what happened at the conference!","Why don't we meet up next weekend?",["opening","news","suggestion","closing"],["Great to hear from you!","You’ll never guess what happened!","We could always …","Can’t wait to hear from you!"],"Write to a friend about an unexpected experience and suggest meeting up."],["Review","Engaging · evaluative","One of the strongest aspects is the nuanced characterisation.","However, it is not without its flaws.",["introduction","strength","weakness","recommendation"],["The plot centres around …","One of the strongest aspects is …","However, it is not without its flaws.","This would appeal to people who …"],"Review a film, book or series for a cultural website, balancing strengths and weaknesses."]];let genre=0,step=0;const state={};const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function key(){return genre+'-'+step}function feedback(ok,yes,no){return '<div class="feedback '+(ok?'':'incorrect')+'">'+(ok?'✓ '+yes:'↻ '+no)+'</div>'}function render(){let g=genres[genre];$('genres').innerHTML=genres.map((x,i)=>'<button class="'+(i===genre?'active':'')+'" onclick="setGenre('+i+')">'+esc(x[0])+'</button>').join('');$('register').textContent=g[1];$('heading').textContent=g[0];$('intro').textContent='Learn to choose language for its communicative purpose, not simply to memorise phrases.';$('bar').style.width=((step+1)/6*100)+'%';const labels=['Genre & register','Match the function','Choose the phrase','Upgrade the register','Build a paragraph','Writing challenge'];$('steps').innerHTML=labels.map((x,i)=>'<button class="'+(i===step?'active':'')+'" onclick="setStep('+i+')">'+(i+1)+'. '+x+'</button>').join('');let out='';if(step===0){out='<h3>Recognise the genre</h3><p>Read this authentic-style opening and decide which register fits.</p><div class="model">'+esc(g[2])+'</div><div class="exercise"><label for="answer">Which register is most appropriate?</label><select id="answer"><option value="">Choose one</option><option value="Formal">Formal</option><option value="Semi-formal">Semi-formal / neutral</option><option value="Friendly">Friendly / conversational</option><option value="Engaging">Engaging / evaluative</option></select><button class="primary" onclick="checkRegister()">Check answer</button><div id="result"></div></div><p class="muted">Think about audience, purpose and the degree of personal involvement.</p>'}if(step===1){out='<h3>Match language to communicative function</h3><p>Match each expression to its purpose. All expressions are adapted from your language bank.</p>'+g[3].map((f,i)=>'<div class="exercise"><div>'+esc(g[4][i])+'</div><label for="m'+i+'">Function</label><select id="m'+i+'"><option value="">Choose a function</option>'+g[3].map((v,j)=>'<option value="'+j+'">'+esc(v)+'</option>').join('')+'</select><div id="r'+i+'"></div></div>').join('')+'<button class="primary" onclick="checkMatch()">Check all answers</button>'}if(step===2){let other=genres[(genre+2)%6];out='<h3>Choose the most appropriate phrase</h3><p>Which expression best fits the genre and communicative purpose?</p><div class="exercise"><p><strong>Situation:</strong> You are writing a '+esc(g[0].toLowerCase())+' and need to express the function <strong>'+esc(g[3][2])+'</strong>.</p><label for="choice">Select an expression</label><select id="choice"><option value="">Choose</option><option value="0">'+esc(other[4][2])+'</option><option value="1">'+esc(g[4][2])+'</option><option value="2">'+esc(other[4][0])+'</option></select><button class="primary" onclick="checkChoice()">Check and explain</button><div id="result"></div></div>'}if(step===3){out='<h3>Upgrade your writing</h3><p>Replace the basic wording with a precise C1 formulation suited to the audience.</p><div class="exercise"><p><strong>Basic version:</strong> '+esc(['Lots of people talk about this issue.','Here are some ideas to make things better.','This report looks at the situation.','I am unhappy about what you said.','I have some exciting news.','There are some really good things about it.'][genre])+'</p><label for="upgrade">Your improved sentence</label><textarea id="upgrade" style="min-height:100px" placeholder="Write a complete, natural sentence…"></textarea><button class="primary" onclick="showModel()">Compare with a C1 model</button><div id="result"></div></div>'}if(step===4){out='<h3>Build a coherent paragraph</h3><p>Put the four communicative moves into a logical sequence. Use the dropdowns to assign positions 1–4.</p>'+[2,0,3,1].map(i=>'<div class="exercise"><p>'+esc(g[4][i])+'</p><label>Position in the text</label><select id="p'+i+'"><option value="">Select</option>'+[1,2,3,4].map(n=>'<option value="'+n+'">'+n+'</option>').join('')+'</select><div id="r'+i+'"></div></div>').join('')+'<button class="primary" onclick="checkOrder()">Check sequence</button><p class="muted small">This is a useful scaffold, not the only valid structure for every writing task.</p>'}if(step===5){out='<h3>Independent writing challenge</h3><p class="model">'+esc(g[5])+'</p><p><strong>Suggested length:</strong> '+(genre===3?'280–320':genre===1||genre===2?'220–260':genre===4?'175–220':'220–260')+' words (adapt to the actual task instructions).</p><div class="exercise"><label for="draft">Your draft</label><textarea id="draft" placeholder="Plan, draft and revise your text here…"></textarea><div id="count" class="muted small">0 words</div><button onclick="saveDraft()">Save on this device</button> <button onclick="copyDraft()">Copy text</button> <button class="primary" onclick="toggleChecklist()">Self-assessment checklist</button><div id="result"></div></div><div id="checklist" hidden><h3>Before submitting</h3><div class="grid">'+['I have addressed every part of the task.','My tone suits the intended reader.','Each paragraph has a clear communicative purpose.','I use precise expressions naturally, not mechanically.','I vary syntax and check grammar, articles and prepositions.','I have checked cohesion, spelling and punctuation.'].map(x=>'<label class="exercise"><input type="checkbox" style="width:auto"> '+x+'</label>').join('')+'</div><h3>Useful model language</h3><div class="model">'+g[4].map(esc).join('<p>')+'</div><p class="muted small">An open-ended draft cannot be reliably graded by this static page. Compare it with the checklist and request teacher feedback.</p></div>'} $('content').innerHTML=out;if(step===5){$('draft').value=localStorage.getItem('c12draft'+genre)||'';$('draft').addEventListener('input',count);count()}}function setGenre(n){genre=n;step=0;render()}function setStep(n){step=n;render()}function checkRegister(){let v=$('answer').value;let expected=['Formal','Semi-formal','Semi-formal','Formal','Friendly','Engaging'][genre];$('result').innerHTML=feedback(v===expected,'Correct. Consider how the audience shapes tone and lexical choice.','Not quite. The expected register is '+expected+'. Look at the intended audience and purpose.')}function checkMatch(){let g=genres[genre];g[3].forEach((f,i)=>{let ok=$('m'+i).value===String(i);$('r'+i).innerHTML=feedback(ok,'Correct: this phrase performs the function “'+esc(f)+'”.','This expression is used for “'+esc(f)+'”.')})}function checkChoice(){let g=genres[genre];$('result').innerHTML=feedback($('choice').value==='1','Correct. “'+esc(g[4][2])+'” fits the requested function and genre.','The most suitable answer is “'+esc(g[4][2])+'”. It matches the required function and register.')}function showModel(){$('result').innerHTML='<div class="feedback"><strong>Suggested model:</strong> '+esc(genres[genre][2])+'<p>Compare accuracy, appropriacy and specificity. Other well-written answers are possible.</p></div>'}function checkOrder(){let g=genres[genre];[2,0,3,1].forEach(i=>{let ok=$('p'+i).value===String(i+1);$('r'+i).innerHTML=feedback(ok,'Good sequencing.','Suggested position: '+(i+1)+'. This follows the scaffold '+g[3].join(' → ')+'.')})}function count(){let s=$('draft').value.trim();$('count').textContent=(s?s.split(/\s+/).length:0)+' words'}function saveDraft(){localStorage.setItem('c12draft'+genre,$('draft').value);$('result').innerHTML='<div class="feedback">Saved in this browser. For a permanent backup, also copy your text.</div>'}function copyDraft(){navigator.clipboard.writeText($('draft').value).then(()=>$('result').innerHTML='<div class="feedback">Text copied.</div>').catch(()=>$('result').innerHTML='<div class="feedback incorrect">Copy unavailable in this browser. Select the text manually.</div>')}function toggleChecklist(){$('checklist').hidden=!$('checklist').hidden}render();
</script></body></html>
