],order:["Whether attendance at university should be compulsory has become a contentious issue.","One argument in favour is that students benefit from classroom discussion and feedback.","Nevertheless, rigid policies may be particularly unfair to learners combining study with employment.","Overall, a flexible approach with clear expectations appears preferable."],orderWhy:"Primero se presenta el debate, después el argumento principal, a continuación la objeción y finalmente una conclusión razonada.",task:["Should attendance be compulsory?","Your class has discussed whether university attendance should be compulsory. Write an essay for an academic audience.",["Explain the advantages of attending classes.","Consider the impact of compulsory attendance on different groups.","Decide which approach is more convincing and justify your view."],"220–260"],model:`The issue of compulsory university attendance has generated considerable debate as institutions attempt to improve student engagement. While regular attendance can undoubtedly support academic progress, imposing a universal requirement may create unnecessary difficulties.

One of the main arguments in favour of compulsory attendance is that meaningful learning often occurs through discussion rather than individual study alone. Seminars allow students to challenge assumptions, benefit from immediate feedback and acquire interpersonal skills. Furthermore, a consistent routine can encourage students who might otherwise struggle to remain motivated. This is particularly relevant in practical subjects, where collaborative tasks are an essential component of the learning process.

However, it could also be argued that physical presence does not automatically lead to participation. Students who work to finance their education, for example, may be disproportionately affected by inflexible policies. Online resources can also enable learners to take greater responsibility for their progress, provided that appropriate support is available. Indeed, a student who engages actively with recorded lectures may achieve more than one who attends reluctantly but contributes very little.

Taking everything into account, the most convincing approach would be to encourage attendance without imposing an indiscriminate requirement. Practical sessions may reasonably demand physical presence, whereas lectures could offer greater flexibility. Ultimately, assessing learning outcomes rather than simply counting hours in the classroom seems more equitable.`,bank:[

],order:["The aim of this proposal is to increase participation in extracurricular activities.","At present, comparatively few students attend the optional conversation sessions.","One possible solution would be to offer shorter themed sessions at different times.","This would enable more learners to participate without increasing costs substantially."],orderWhy:"La lógica de una proposal es propósito → problema → solución → beneficio.",task:["Make our school more engaging","The director of your language school wants to encourage students to take part in activities beyond lessons. Write a proposal.",["Identify two obstacles to participation.","Recommend two achievable changes.","Explain their benefits and how they could be introduced."],"220–260"],model:`PROPOSAL: Increasing Student Participation

Aim
The aim of this proposal is to recommend realistic ways of increasing participation in extracurricular language activities. The suggestions are based on informal feedback from learners.

Current situation
At present, optional conversation sessions attract relatively few students. One of the main problems concerns scheduling: many activities take place at times that are inconvenient for working adults. Furthermore, some learners are reluctant to attend because they are uncertain about the format. As a result, even motivated students may choose not to participate.

Recommendations
It is recommended that the school introduce shorter, themed sessions at different times. A monthly programme could focus on practical topics such as workplace conversations or current affairs. Another option worth considering is a peer-mentoring scheme, allowing students from different levels to practise together. Both activities could initially be organised as small-scale pilots, giving staff an opportunity to gauge demand.

Benefits and feasibility
This would have the benefit of making activities more predictable and accessible. Implementation would be relatively straightforward because existing rooms could be used. A brief survey would help establish which times suit students best. Publicising the sessions through the school's existing communication channels would also keep costs low.

Conclusion
Given the above, these changes appear both practical and beneficial. I strongly recommend trialling them for a term and then evaluating participation and student feedback.`,bank:[

],order:["The purpose of this report is to evaluate study facilities for evening learners.","According to feedback gathered, classrooms are generally well equipped.","However, the shortage of quiet study spaces remains a significant concern.","It would therefore be advisable to extend access to the library after 7 p.m."],orderWhy:"Un report claro sigue propósito → hallazgos → limitación → recomendación vinculada a los hallazgos.",task:["Facilities for evening learners","Your school has asked you to write a report about the facilities available to evening learners. Use plausible observations and present them as illustrative if you have not conducted a real survey.",["Describe key strengths of the facilities.","Identify the most important limitations.","Recommend specific, realistic improvements."],"220–260"],model:`REPORT: Facilities for Evening Learners

Introduction
The purpose of this report is to assess the extent to which the school's facilities meet the needs of evening learners. It draws on informal comments and observations made during the current term.

Positive findings
One positive aspect is the quality of classroom equipment. Most rooms have functioning projectors, and materials are generally available online. Students also value the school's central location and welcoming atmosphere.

Areas for improvement
On the other hand, a major concern relates to the limited availability of quiet study areas after 7 p.m. Learners arriving early often have nowhere suitable to revise. Another drawback is that some classrooms become uncomfortable during warmer months, potentially affecting concentration. Although these issues do not affect every learner, they may be particularly problematic for those travelling considerable distances to attend class.

Recommendations
Steps should be taken to keep a designated study room open throughout the evening. This would require relatively few resources, as existing space could be used. It would also be advisable to review temperature control in the busiest classrooms. A simple maintenance log could help staff identify recurring problems and prioritise inexpensive adjustments.

Conclusion
On balance, the school provides a positive learning environment, but these practical improvements would make its facilities considerably more accessible to adult learners. Reviewing the changes after one term would establish whether additional measures were necessary.`,bank:[

I am writing with regard to your recent article claiming that public funding for adult language education represents an unnecessary expense. While I recognise the importance of responsible spending, I strongly believe this argument overlooks the wider benefits of lifelong learning.

Firstly, language education can significantly improve employability. Adults increasingly need to retrain, change careers or work with international clients. Access to affordable classes is particularly valuable for those unable to pay for private tuition. It would therefore be misleading to dismiss language learning as a luxury.

Furthermore, your article fails to consider the social benefits of such provision. Adult classrooms bring together people from different backgrounds and generations, encouraging integration and reducing isolation. Although these outcomes are difficult to quantify, they remain valuable to local communities. For some learners, attending a weekly course is also a source of confidence and renewed independence, especially after a period of unemployment or major personal change.

I acknowledge that publicly funded programmes should be evaluated carefully. Nevertheless, a meaningful assessment ought to consider long-term educational and social outcomes rather than focusing exclusively on immediate costs. Reducing access could ultimately reinforce inequality. Moreover, as employers increasingly seek adaptable workers, removing opportunities for adult learning seems difficult to reconcile with the stated goal of improving workforce skills.

I would appreciate it if you could publish a follow-up article reflecting the perspectives of learners and education professionals. A more balanced discussion would enable readers to form an informed opinion. It might also be useful to include evidence from local institutions about attendance, learner goals and subsequent opportunities.

Thank you for your attention to this matter. I look forward to your response.

Yours faithfully,
A concerned reader`,bank:[

Set in a seemingly peaceful coastal town, The Last Harbour follows a family whose carefully guarded secrets begin to unravel after an unexpected reunion. Although its premise sounds familiar, the series approaches the story with unusual sensitivity.

One of the strongest aspects is the characterisation. Rather than dividing the cast into heroes and villains, the script gradually reveals the motives behind their questionable decisions. The performances are consistently convincing, and the coastal cinematography reinforces the atmosphere of quiet tension. What I particularly enjoyed was how apparently insignificant conversations acquired greater meaning as the story progressed. This attention to detail rewards patient viewing and makes the eventual twists feel genuinely earned.

However, it is not without its flaws. Several episodes in the middle of the season feel unnecessarily drawn out, while one subplot is abandoned just as it becomes interesting. A tighter edit would have given the final revelations more impact. Even so, the atmospheric soundtrack and restrained direction prevent the pace from becoming entirely frustrating.

Despite these shortcomings, the series remains a compelling and emotionally intelligent drama. I would definitely recommend it to viewers who appreciate nuanced characters and gradual storytelling over constant action. If you are looking for a fast-paced thriller, you might find it frustrating. Otherwise, it is well worth watching.`,bank:[

function structure(g){if(!order)order=[2,0,3,1];return '<div class="stage-label">04 / Structure</div><h2 class="stage-title">Build the logic.</h2><p class="stage-desc">Ordena estos cuatro fragmentos para crear un texto coherente.</p><div class="note"><strong>How to:</strong> pulsa «Subir» o «Bajar». La tarjeta 1 será el inicio del texto.</div><div class="sequence">'+order.map((index,i)=>'<div class="sequence-row"><span class="position">'+(i+1)+'</span><p>'+esc(g.order[index])+'</p><div class="move"><button title="Subir" aria-label="Subir fragmento '+(i+1)+'" data-action="up" data-index="'+i+'" '+(i===0?"disabled":"")+'>↑</button><button title="Bajar" aria-label="Bajar fragmento '+(i+1)+'" data-action="down" data-index="'+i+'" '+(i===3?"disabled":"")+'>↓</button></div></div>').join("")+'</div>'+feedbackBox()+actions("checkOrder","Comprobar orden","Continuar: Escribe")}
function modelView(g){return '<div class="model"><h3>Model answer</h3>'+g.model.split(/\n\n/).map(p=>'<p>'+esc(p).replace(/\n/g,"<br>")+'</p>').join("")+'<p class="disclaimer">Modelo orientativo original; no es una respuesta oficial de examen ni la única respuesta válida.</p></div>'}
function writing(g){const t=g.task,draft=progress.drafts[g.id]||"",count=draft.trim()?draft.trim().split(/\s+/).length:0;return '<div class="stage-label">05 / Your writing challenge</div><h2 class="stage-title">Now it’s your turn.</h2><p class="stage-desc">Planifica, redacta y revisa. Al terminar, contrasta tus decisiones con el modelo.</p><div class="task-sheet"><small class="tag">Writing task · '+esc(g.name)+'</small><h3>'+esc(t[0])+'</h3><p>'+esc(t[1])+'</p><ul>'+t[2].map(x=>'<li>'+esc(x)+'</li>').join("")+'</ul><span class="wordpill">Suggested length · '+esc(t[3])+' words</span></div><strong style="font-size:15px">Your paragraph plan</strong><div class="plan">'+g.roadmap.map((x,i)=>'<div><small>0'+(i+1)+'</small>'+esc(x)+'</div>').join("")+'</div><label class="input-label" for="draft">Your draft</label><textarea id="draft" placeholder="Write your text here. It is automatically saved in this browser…">'+esc(draft)+'</textarea><div class="count"><span>Guardado automáticamente en este dispositivo</span><strong id="wordCount">'+count+' words</strong></div><div class="actions"><button class="btn-main" data-action="checklist">'+(checklist?"Ocultar checklist":"Revisar mi texto")+'</button><button class="btn-ghost" data-action="copy">Copiar</button><button class="btn-ghost" data-action="download">Descargar .txt</button></div>'+(toast?'<div class="toast" role="status">'+esc(toast)+'</div>':"")+(checklist?'<div class="checklist"><h3>Self-assessment · C1.2</h3>'+["I have answered every part of the task.","My register suits the reader and purpose.","My paragraphs develop ideas in a logical order.","I justify my points with reasons or examples.","My C1 expressions sound natural, not memorised.","I have checked grammar, vocabulary, cohesion and punctuation."].map(x=>'<label><input type="checkbox">'+x+'</label>').join("")+'</div>':"")+'<div class="actions"><button class="btn-link" data-action="model">'+(model?"Ocultar modelo":"Ver modelo orientativo y comparar")+'</button></div>'+(model?modelView(g):"")+'<p class="disclaimer">Las actividades cerradas se autocorrigen. Un texto libre necesita revisión humana; esta herramienta ofrece guía, checklist y modelo, no una nota automática.</p>'}
function render(){if(!active){app.innerHTML=home();return}let g=active;let side='<aside class="coach"><div class="eyebrow">Writing coach</div><h3>A little guidance.</h3><p>'+esc(g.tip)+'</p><details><summary>Consultar language bank</summary><p>Expresiones del documento original organizadas según su función.</p>'+g.bank.map(x=>'<div class="bank-group"><strong>'+esc(x[0])+'</strong><ul>'+x[1].split("|").map(y=>'<li>'+esc(y)+'</li>').join("")+'</ul></div>').join("")+'</details><p style="border-top:1px solid #d7d0ed;padding-top:15px;margin-top:18px">Tu progreso se guarda en este navegador. No requiere registrarse.</p></aside>';app.innerHTML='<main class="container lesson"><button class="back" data-action="home">← &nbsp; Todos los tipos de texto</button><div class="lesson-head"><div><div class="eyebrow">Writing Studio / '+g.label+'</div><h1>'+esc(g.name)+'<span style="color:'+g.color+'">.</span></h1><p>'+esc(g.subtitle)+' · '+esc(g.register)+'</p></div><div class="round-progress"><strong>'+score(g)+'/8</strong><span>mastered</span></div></div><nav class="step-nav" aria-label="Lesson steps">'+STEPS.map((x,i)=>'<button data-action="step" data-step="'+i+'" class="'+(step===i?"active ":"")+(i<step?"done":"")+'" '+(step===i?'aria-current="step"':"")+'><span>'+(i+1)+'</span>'+x[1]+'</button>').join("")+'</nav><div class="lesson-body"><section class="workarea">'+[discover,choose,rewrite,structure,writing][step](g)+'</section>'+side+'</div></main>'}
function next(){if(step===1||step===2){if(q<2){q++;selected=null;inputValue="";feedback=null;render()}else nav(active.id,step+1)}else nav(active.id,step+1)}
function checkTone(){let t=active.tone;if(selected===null){feedback={ok:false,text:"Elige A, B o C antes de comprobar."}}else{let ok=selected===t[2];feedback={ok,text:(ok?"":'Respuesta recomendada: '+String.fromCharCode(65+t[2])+'. ')+t[3]};if(ok)solved(0)}render()}
function checkCloze(){let t=active.cloze[q];if(selected===null){feedback={ok:false,text:"Primero selecciona una expresión."}}else{let ok=selected===t[3];feedback={ok,text:(ok?"":'La opción adecuada es '+String.fromCharCode(65+t[3])+': «'+t[2][t[3]]+'». ')+t[4]};if(ok)solved(1,q)}render()}
function checkRewrite(show=false){let t=active.rewrite[q];let v=inputValue.trim();if(!v&&!show){feedback={ok:false,text:"Escribe primero la expresión que falta."}}else{let ok=!show&&norm(v)===norm(t[3]);feedback={ok,text:(ok?"«"+t[3]+"». ":"Respuesta objetivo: «"+t[3]+"». ")+t[5]};if(ok)solved(2,q)}render()}
function checkOrder(){let ok=order.every((x,i)=>x===i);feedback={ok,text:(ok?"":"Orden recomendado: introducción, argumento o hallazgo, contraste y cierre. ")+active.orderWhy};if(ok)solved(3);render()}
function loadHash(){let raw=location.hash.slice(1),match=raw.match(/^([a-z]+)\/([0-4])$/);active=match?GENRES.find(x=>x.id===match[1])||null:null;step=match?Number(match[2]):0;resetUI();render()}
document.addEventListener("click",async e=>{let el=e.target.closest("[data-action]");if(!el)return;let a=el.dataset.action;if(a==="scroll"){document.getElementById("genres").scrollIntoView({behavior:"smooth"});return}if(a==="open"){nav(el.dataset.id);return}if(a==="home"){nav(null);return}if(a==="step"){nav(active.id,+el.dataset.step);return}if(a==="select"){selected=+el.dataset.index;feedback=null;render();return}if(a==="checkTone"){checkTone();return}if(a==="checkCloze"){checkCloze();return}if(a==="checkRewrite"||a==="solution"){inputValue=document.getElementById("rewriteInput")?.value||inputValue;checkRewrite(a==="solution");return}if(a==="next"){next();return}if(a==="up"||a==="down"){let i=+el.dataset.index,j=i+(a==="up"?-1:1);if(j>=0&&j<order.length){[order[i],order[j]]=[order[j],order[i]];feedback=null;render()}return}if(a==="checkOrder"){checkOrder();return}if(a==="checklist"){checklist=!checklist;render();return}if(a==="model"){model=!model;render();return}if(a==="copy"){let t=progress.drafts[active.id]||"";if(!t.trim()){toast="Escribe primero tu texto.";render();return}try{await navigator.clipboard.writeText(t);toast="Texto copiado."}catch(_){toast="No se pudo copiar. Selecciona el texto y cópialo manualmente."}render();return}if(a==="download"){let t=progress.drafts[active.id]||"";if(!t.trim()){toast="Escribe primero tu texto.";render();return}let url=URL.createObjectURL(new Blob([t],{type:"text/plain;charset=utf-8"})),link=document.createElement("a");link.href=url;link.download="C12-"+active.id+"-draft.txt";link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast="Borrador descargado.";render()}});
document.addEventListener("input",e=>{if(e.target.id==="rewriteInput"){inputValue=e.target.value}else if(e.target.id==="draft"&&active){progress.drafts[active.id]=e.target.value;save();let n=e.target.value.trim()?e.target.value.trim().split(/\s+/).length:0;document.getElementById("wordCount").textContent=n+" words"}});
window.addEventListener("hashchange",loadHash);loadHash();
</script>
</body>
