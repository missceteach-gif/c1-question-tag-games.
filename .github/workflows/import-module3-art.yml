          out = pathlib.Path('module3-grammar/assets')
          out.mkdir(parents=True, exist_ok=True)
          for i, url in enumerate(links, 1):
              req = urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req, timeout=30) as response:
                  b = response.read()
              if len(b) < 1000: raise ValueError(f'Image {i} too small: {len(b)}')
              path = out / f'illustration-{i:02}.jpg'
              path.write_bytes(b)
              print(f'{path}: {len(b)} bytes')
          PY
      - name: Commit original card illustrations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add module3-grammar/assets/illustration-*.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Add original illustrated card artwork for Module 3"
            git push
          fi
