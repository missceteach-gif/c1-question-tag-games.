px;right:-25px}.funbanner:after{width:155px;height:155px;bottom:-115px;left:-20px}.funbanner span{font-size:74px;filter:drop-shadow(5px 7px 0 #ffffffb4);z-index:1}.headline{font-size:clamp(23px,5.1vw,33px);font-weight:1000;line-height:1.16;letter-spacing:-.03em;margin:0 0 15px}.story{font-size:clamp(21px,4.95vw,27px);line-height:1.4;font-weight:600;margin:0 0 19px}.tasklabel{font-size:13px;text-transform:uppercase;letter-spacing:.12em;font-weight:950;color:#167888;margin:0 0 8px}.task{font-size:clamp(22px,5.2vw,29px);line-height:1.38;font-weight:850;margin:0 0 19px}.follow{margin-top:17px;border-top:2px dashed #d4e6e8;padding-top:15px;font-size:clamp(18px,4vw,22px);line-height:1.43}.follow b{color:#146878}.hint-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.secondary{background:#fff;border:2px solid #b5dadd;color:#17576b;border-radius:14px;padding:13px 9px;font-size:clamp(15px,3.6vw,18px);font-weight:850;min-height:54px}.primary{background:#136e7f;border:2px solid #136e7f;color:#fff;border-radius:14px;padding:13px 16px;font-size:clamp(18px,4.2vw,21px);font-weight:900;min-height:57px}.revealed{margin-top:13px;padding:15px;background:#edf9f6;border:2px solid #c5e8e1;border-radius:15px;line-height:1.5;font-size:clamp(18px,4vw,22px)}.revealed b{color:#185f6b}.revealed.model{background:#fff4e2;border-color:#f2ddb8}.actions{display:grid;grid-template-columns:1fr 1.45fr;gap:12px;margin-top:22px}.bottom{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px}.textbutton{border:none;background:none;color:#226d79;font-size:16px;font-weight:800;text-decoration:underline;text-underline-offset:4px;padding:9px}.finish{background:#e4f7e8;border-radius:20px;padding:25px;text-align:center;margin-top:10px}.finish h2{font-size:30px;margin:6px 0 10px}.finish p{font-size:21px;line-height:1.48}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}footer{text-align:center;color:#5b7581;font-size:13px;line-height:1.5 <script>
'use strict';
const DATA={"original":[{"text":"She’s excited about ___ (start) her new photography course.","options":["starting","to start"],"answer":"starting","explain":"After the preposition <b>about</b>, use the <b>-ing form</b>: excited about starting.","image":"assets/original-01.webp","illustration":0},{"text":"I heard someone ___ (sing) loudly in the shower.","options":["singing","to sing","sing"],"answer":"singing","explain":"<b>Hear + object + -ing</b> focuses on an action in progress. <b>Hear + object + bare infinitive</b> can also be correct when the entire action is perceived.","alternative":"sing","image":"assets/original-02.webp","illustration":1},{"text":"We watched the chef ___ (prepare) the dish from start to finish.","options":["preparing","to prepare","prepare"],"answer":"prepare","explain":"<b>Watch + object + bare infinitive</b> is especially natural for a complete action (“from start to finish”). <b>-ing</b> is also grammatical if the focus is the ongoing activity.","alternative":"preparing","image":"assets/original-03.webp","illustration":2},{"text":"Daniela forgot ___ (lock) the door last night.","options":["locking","to lock"],"answer":"to lock","explain":"<b>Forget + to-infinitive</b> = fail to do something that you were supposed to do.","image":"assets/original-04.webp","illustration":3},{"text":"I’ll never forget ___ (meet) you for the first time.","options":["to meet","meeting"],"answer":"meeting","explain":"<b>Forget + -ing</b> = forget a memory or past experience. The first meeting already happened.","image":"assets/original-05.webp","illustration":4},{"text":"Did you remember ___ (send) the email to the director?","options":["sending","to send"],"answer":"to send","explain":"<b>Remember + to-infinitive</b> = remember to perform a necessary action.","image":"assets/original-06.webp","illustration":5},{"text":"I remember ___ (travel) through Italy by train.","options":["to travel","travelling"],"answer":"travelling","explain":"<b>Remember + -ing</b> = recall something that happened in the past. <i>Traveling</i> is also a correct American English spelling.","image":"assets/original-07.webp","illustration":6},{"text":"I meant ___ (call) you yesterday.","options":["calling","to call"],"answer":"to call","explain":"<b>Mean + to-infinitive</b> = intend to do something.","image":"assets/original-08.webp","illustration":7},{"text":"This new plan will mean ___ (work) extra hours in June.","options":["to work","working"],"answer":"working","explain":"<b>Mean + -ing</b> = involve or result in something.","image":"assets/original-09.webp","illustration":8},{"text":"We regret ___ (inform) you that the workshop has been cancelled.","options":["informing","to inform"],"answer":"to inform","explain":"<b>Regret + to-infinitive</b> is used to introduce unwelcome news, often formally.","image":"assets/original-10.webp","illustration":9},{"text":"I really regret ___ (not study) harder at university.","options":["not to study","not studying"],"answer":"not studying","explain":"<b>Regret + -ing</b> = feel sorry about a past action. Place <b>not</b> before the gerund: not studying.","image":"assets/original-11.webp","illustration":10},{"text":"I tried ___ (fix) the printer, but it didn’t work.","options":["fixing","to fix"],"answer":"to fix","explain":"<b>Try + to-infinitive</b> = make an effort or attempt. <b>Try + -ing</b> can also be possible if the repair is viewed as an experiment.","alternative":"fixing","image":"assets/original-12.webp","illustration":11},{"text":"Why don’t you try ___ (sleep) with the window open?","options":["to sleep","sleeping"],"answer":"sleeping","explain":"<b>Try + -ing</b> = experiment with a possible solution.","image":"assets/original-13.webp","illustration":12},{"text":"She stopped ___ (buy) a snack before the meeting.","options":["buying","to buy"],"answer":"to buy","explain":"<b>Stop + to-infinitive</b> = pause one activity in order to do another.","image":"assets/original-14.webp","illustration":13},{"text":"We tried ___ (fix) the car, but it didn’t turn on.","options":["fixing","to fix"],"answer":"to fix","explain":"<b>Try + to-infinitive</b> = attempt to repair it. <b>Try + -ing</b> can also describe testing the repair as a possible solution.","alternative":"fixing","image":"assets/original-15.webp","illustration":14}],"switch":[{"title":"The holiday disaster","emoji":"🧳","story":"Asier arrives in Rome and realises that his suitcase is still in his bedroom. Luckily, he meets his favourite celebrity at the airport.","task":"Explain the mistake and the unforgettable moment.","grammar":"forgot to + verb / will never forget + -ing","model":"Asier forgot to pack his suitcase, but he’ll never forget meeting his idol at the airport.","follow":"What have you forgotten to pack?"},{"title":"The most expensive favour","emoji":"🎂","story":"María agreed to organise Natalia’s surprise birthday party. Now she has 146 WhatsApp messages, two family arguments and a missing cake.","task":"Explain what María intended and what organising it involves.","grammar":"meant to + verb / means + -ing","model":"María meant to organise a simple celebration, but it means dealing with endless messages and family drama.","follow":"Would you volunteer to organise a party?"},{"title":"The official apology","emoji":"📨","story":"Hamida accidentally sent her private complaint about the photocopier to every teacher. She also has to announce that tomorrow’s workshop is cancelled.","task":"Explain her mistake and deliver the bad news formally.","grammar":"regret + -ing / regret to + verb","model":"Hamida regrets sending the complaint. We regret to inform you that tomorrow’s workshop has been cancelled.","follow":"Have you ever sent a message to the wrong person?"},{"title":"Tech support from hell","emoji":"🖨️","story":"Víctor has spent forty minutes trying to repair the projector. Alberto suggests connecting a different laptop.","task":"Explain the effort and suggest an alternative experiment.","grammar":"tried to + verb / try + -ing","model":"Víctor tried to fix the projector, but it didn’t work. Why not try connecting Alberto’s laptop?","follow":"What is your worst technology disaster?"},{"title":"The pizza problem","emoji":"🍕","story":"Pablo interrupts his revision to order a pizza. After five pizza dinners in a row, he decides he needs a change.","task":"Explain why he interrupted studying and which habit he abandoned.","grammar":"stopped to + verb / stopped + -ing","model":"Pablo stopped studying to order a pizza. Five days later, he stopped eating pizza every night.","follow":"Which habit would you like to stop?"},{"title":"The never-ending holiday","emoji":"📸","story":"Sandro has described his holiday for fifteen minutes. Then he continues for another ten and starts showing 283 photographs.","task":"Explain the continuation and the next activity.","grammar":"went on + -ing / went on to + verb","model":"Sandro went on talking about his holiday, and then he went on to show us 283 photos.","follow":"When do holiday stories become too long?"},{"title":"The important email","emoji":"📧","story":"Nerea receives an email asking her to confirm a booking. It reminds her of a disastrous hotel where she stayed last summer.","task":"Give advice and describe her memory.","grammar":"remember to + verb / remember + -ing","model":"Nerea must remember to confirm the booking. She still remembers staying at that terrible hotel.","follow":"What is a place you remember visiting?"},{"title":"The missing invitation","emoji":"🎟️","story":"Sole promised to invite Lucía to a concert. The day arrives, but Lucía has heard nothing. Sole, however, remembers discussing the concert last month.","task":"Explain what Sole failed to do and what she recalls.","grammar":"forget to + verb / remember + -ing","model":"Sole forgot to send the invitation, although she remembers talking to Lucía about the concert.","follow":"Have you ever forgotten an important date?"},{"title":"The secret birthday","emoji":"🎉","story":"Amor is planning a surprise for Antonio but accidentally mentions it in front of him. Afterwards, she starts writing a new plan.","task":"Explain what she intended to do and what she regrets.","grammar":"meant to + verb / regret + -ing","model":"Amor meant to keep the party a secret, but she regrets mentioning it in front of Antonio.","follow":"Could you keep a surprise party secret?"},{"title":"The 3 a.m. solution","emoji":"🌙","story":"Daniel can’t sleep. Alejandro suggests leaving the phone in another room, but Daniel insists on watching videos in bed.","task":"Give experimental advice and say what he should stop doing.","grammar":"try + -ing / stop + -ing","model":"Daniel should try leaving his phone in another room and stop watching videos before bed.","follow":"What helps you sleep?"},{"title":"The dramatic coffee break","emoji":"☕","story":"The class has been debating for an hour. María pauses the debate to buy coffee and then continues arguing from the corridor.","task":"Explain the interruption and the continuing action.","grammar":"stop to + verb / go on + -ing","model":"María stopped to buy a coffee, but then went on arguing from the corridor.","follow":"Do you prefer long debates or short discussions?"},{"title":"The wrong attachment","emoji":"📎","story":"Iván intended to email his CV but attached a picture of his cat instead. He will always remember the interviewer’s reaction.","task":"Describe his intention and the memory.","grammar":"mean to + verb / never forget + -ing","model":"Iván meant to attach his CV, but he’ll never forget seeing the interviewer’s confused expression.","follow":"What embarrassing email mistakes have you heard about?"},{"title":"The unforgettable exam","emoji":"📝","story":"Natalia revises until midnight and wants to remember to set three alarms. Years later, she still recalls the exam room vividly.","task":"Contrast the necessary task and the past memory.","grammar":"remember to + verb / remember + -ing","model":"Natalia must remember to set her alarms. She still remembers sitting in that exam room.","follow":"What exam memory has stayed with you?"},{"title":"The final announcement","emoji":"📢","story":"The principal has to cancel a school trip. The organisers are disappointed because they neglected to check the weather forecast.","task":"Give the formal announcement and explain the organisers’ mistake.","grammar":"regret to + verb / forgot to + verb","model":"We regret to announce that the trip has been cancelled. The organisers forgot to check the forecast.","follow":"Should outdoor trips go ahead in bad weather?"}],"wrong":[{"title":"The 90-minute voice note","emoji":"🎙️","story":"Iván sends a voice note explaining a yes-or-no question. It lasts 90 minutes.","task":"Speculate about what he seems to have been doing.","grammar":"seems to have been + -ing","model":"Iván seems to have been explaining the question for an unnecessarily long time.","follow":"What is an acceptable voice-note length?"},{"title":"The mysteriously perfect essay","emoji":"🕵️","story":"Sole’s essay is identical to an article published online two years ago. She denies everything.","task":"Speculate carefully about a past action.","grammar":"appears to have + past participle","model":"Sole appears to have copied parts of the article, although we can’t be certain.","follow":"How should teachers deal with suspected plagiarism?"},{"title":"The reluctant volunteer","emoji":"🙋","story":"Nerea really doesn’t want to rewrite the entire report, but her manager insists.","task":"Describe what the manager forced her to do using the passive.","grammar":"was made to + verb","model":"Nerea was made to rewrite the entire report.","follow":"When is asking someone to redo work reasonable?"},{"title":"The impossible suitcase","emoji":"⚖️","story":"Antonio’s suitcase weighs 45 kilos, but the airline has a strict limit.","task":"Explain why it cannot go on the plane, using both target structures.","grammar":"too + adjective + to / adjective + enough + to","model":"The suitcase is too heavy to take on board, and Antonio isn’t strong enough to carry it alone.","follow":"What is the most unnecessary thing you have packed?"},{"title":"The last slice","emoji":"🍕","story":"Amor gives the final slice of pizza to Lucía even though she is starving.","task":"Praise her generosity using an impersonal structure.","grammar":"It was + adjective + of + person + to + verb","model":"It was incredibly kind of Amor to give Lucía the last slice.","follow":"Would you share your favourite food?"},{"title":"The corridor superstar","emoji":"🎤","story":"Alejandro hears someone singing dramatically in the corridor; later he hears the whole song from beginning to end.","task":"Describe the ongoing action and the complete action.","grammar":"hear + object + -ing / bare infinitive","model":"Alejandro heard someone singing in the corridor, and later he heard them sing the entire song.","follow":"What sound distracts you most?"},{"title":"The office hero","emoji":"🦸","story":"Hamida arrives before everyone else and solves the projector problem. She volunteers to help other teachers.","task":"Describe her using an ordinal and an adjective of willingness.","grammar":"the first to + verb / willing to + verb","model":"Hamida was the first to arrive and was willing to help everybody.","follow":"What makes someone a good colleague?"},{"title":"The holiday obsession","emoji":"🏖️","story":"Alberto has a countdown to his next trip on every device, including his calculator.","task":"Explain what he is looking forward to and what he plans to do.","grammar":"look forward to + -ing / plan to + verb","model":"Alberto is looking forward to relaxing on the beach and plans to do absolutely nothing.","follow":"What are you looking forward to?"},{"title":"The expensive shoes","emoji":"👟","story":"Víctor buys trainers that cost more than his monthly rent. He insists they will make him run faster.","task":"Explain the situation using too/enough and a purpose infinitive.","grammar":"too + adjective + to / to + verb (purpose)","model":"The trainers are too expensive to be practical, but Víctor bought them to improve his running.","follow":"Can expensive equipment make a difference?"},{"title":"The suspicious interview","emoji":"🧑‍💼","story":"Pablo claims to have worked at NASA. When asked about rockets, he suddenly talks about sandwiches.","task":"Express scepticism about his claim using a perfect infinitive.","grammar":"claims to have + past participle","model":"Pablo claims to have worked at NASA, but his answers are rather unconvincing.","follow":"What is the strangest job claim you have heard?"},{"title":"The classroom dance","emoji":"💃","story":"At 8 p.m., María watches Sandro perform a dance in the corridor from start to finish.","task":"Describe the complete action, then the action in progress.","grammar":"watch + object + bare infinitive / -ing","model":"María watched Sandro perform the whole dance; several students also watched him dancing in the corridor.","follow":"Would you take part in a surprise performance?"},{"title":"The very first reply","emoji":"⚡","story":"Lucía replies to every group message before anyone else, including messages sent at 4 a.m.","task":"Describe her with an ordinal + infinitive and speculate about how much she sleeps.","grammar":"the first to + verb / seems to + verb","model":"Lucía is always the first to reply and seems to sleep very little.","follow":"Do people expect immediate replies?"},{"title":"The risky shortcut","emoji":"🛴","story":"Daniel decides to travel across Huelva on an electric scooter during a thunderstorm.","task":"Explain why it is unwise with an infinitive after an adjective.","grammar":"It is + adjective + to + verb","model":"It’s dangerous to travel by scooter during a thunderstorm.","follow":"When would you choose public transport instead?"},{"title":"The international chef","emoji":"🍳","story":"Hamida cooks an amazing meal but refuses to share the recipe. Sole cannot believe how good it tastes.","task":"Describe the unexpected reaction and Hamida’s decision.","grammar":"only to + verb / refuse to + verb","model":"Sole tried to recreate the dish, only to discover she was missing the key ingredient. Hamida refused to reveal the recipe.","follow":"Should family recipes remain secret?"},{"title":"The never-ending revision","emoji":"📚","story":"Alejandro has been revising grammar since breakfast. His friends suspect he has forgotten to eat lunch.","task":"Speculate about an ongoing past activity and a forgotten obligation.","grammar":"may / seems to have been + -ing / forget to + verb","model":"Alejandro seems to have been revising all day and may have forgotten to eat lunch.","follow":"How much revision is too much?"},{"title":"The award ceremony","emoji":"🏆","story":"Sandro thinks he has won a prize, but the presenter announces somebody else’s name.","task":"Describe his disappointed discovery using an infinitive of unexpected result.","grammar":"only to + verb","model":"Sandro stood up to receive the prize, only to realise it belonged to someone else.","follow":"Have you ever celebrated too early?"}],"drama":[{"title":"The WhatsApp nightmare","emoji":"📱","story":"Alberto sends 42 voice messages to explain a question that could have been answered with “yes”.","task":"React as dramatically as possible.","grammar":"utterly ridiculous / particularly annoying","model":"That is utterly ridiculous! Forty-two messages would be particularly annoying.","follow":"When do messages become excessive?"},{"title":"A modern miracle","emoji":"📶","story":"The classroom Wi-Fi works perfectly for an entire lesson. Not a single interruption.","task":"React as though you have witnessed a historic event.","grammar":"absolutely incredible / completely unexpected","model":"That is absolutely incredible — and completely unexpected!","follow":"Which small miracle would improve your day?"},{"title":"The cat influencer","emoji":"🐈","story":"Pablo’s cat has five Instagram accounts and makes more money than Pablo.","task":"Describe the cat as an international celebrity.","grammar":"a total celebrity / absolutely absurd","model":"That cat is a total celebrity. The whole situation is absolutely absurd.","follow":"Would you follow an animal influencer?"},{"title":"The overthinker","emoji":"🧾","story":"Natalia prepares a 19-page packing list for a weekend away.","task":"Compliment her, but express concern too.","grammar":"extremely organised / deeply worried","model":"Natalia is extremely organised, but I’m deeply worried about the length of that list.","follow":"Are you a planner or an improviser?"},{"title":"The coffee catastrophe","emoji":"☕","story":"Someone has replaced the coffee machine with a kettle. Everyone looks devastated.","task":"Deliver a deeply dramatic complaint.","grammar":"bitterly disappointed / absolutely furious","model":"I’m bitterly disappointed and absolutely furious about this completely unnecessary change.","follow":"What everyday inconvenience makes you furious?"},{"title":"The mystery smell","emoji":"🧦","story":"Sandro brings a gym bag to class. It has not been opened since August.","task":"Explain the experience without being rude.","grammar":"absolutely disgusting / terribly embarrassing","model":"The smell is absolutely disgusting, and the situation is terribly embarrassing.","follow":"What smells should be banned in classrooms?"},{"title":"The perfect presentation","emoji":"✨","story":"Nerea presents a beautiful slideshow with a perfect font size and no spelling mistakes.","task":"Give an absurdly enthusiastic review.","grammar":"absolutely brilliant / a real success","model":"Nerea’s presentation was absolutely brilliant — a real success!","follow":"What makes a presentation memorable?"},{"title":"The accidental celebrity","emoji":"📸","story":"Iván accidentally appears behind a TV presenter, waves once and becomes famous online.","task":"Describe the surprise and the impact.","grammar":"completely unexpected / an absolute sensation","model":"His sudden fame was completely unexpected. Overnight, Iván became an absolute sensation.","follow":"Would you want to go viral?"},{"title":"The complicated sandwich","emoji":"🥪","story":"Víctor gives an eight-minute presentation on how to make toast.","task":"React with an appropriate extreme adjective.","grammar":"utterly unnecessary / terribly complicated","model":"That explanation was utterly unnecessary. He made a simple task sound terribly complicated.","follow":"Which simple task do people overcomplicate?"},{"title":"The birthday surprise","emoji":"🎁","story":"Lucía gets a birthday present wrapped in 17 layers of paper. Inside is a single pen.","task":"Say how she might feel, with strong collocations.","grammar":"bitterly disappointed / genuinely grateful","model":"Lucía might be bitterly disappointed, although she’ll probably try to look genuinely grateful.","follow":"What makes a thoughtful present?"},{"title":"The classroom revolution","emoji":"🪑","story":"Antonio moves all the chairs into a perfect circle in three minutes. The class applauds.","task":"Give him a ridiculously positive performance review.","grammar":"extremely efficient / a complete transformation","model":"Antonio was extremely efficient. The rearrangement was a complete transformation.","follow":"How should desks be arranged for speaking?"},{"title":"The final episode","emoji":"📺","story":"María avoids spoilers for six months, then her brother reveals the ending over breakfast.","task":"Describe the betrayal and her reaction.","grammar":"absolutely furious / deeply upset","model":"María was absolutely furious and deeply upset by the spoiler.","follow":"Should spoilers be treated as a serious offence?"},{"title":"The enormous bargain","emoji":"🛍️","story":"Amor buys a brand-new coat for one euro, but discovers it is three sizes too small.","task":"Describe the bargain and the disappointment.","grammar":"a real bargain / bitterly disappointed","model":"It looked like a real bargain, but she was bitterly disappointed when it didn’t fit.","follow":"What is your best bargain ever?"},{"title":"The legendary excuse","emoji":"⏰","story":"Alejandro is 45 minutes late because his goldfish supposedly hid his car keys.","task":"Explain why you are not persuaded.","grammar":"utterly implausible / completely ridiculous","model":"That explanation is utterly implausible and completely ridiculous.","follow":"What is the funniest excuse you have ever heard?"},{"title":"The heroic photocopier","emoji":"🦾","story":"The photocopier prints 200 pages without jamming. The teachers consider giving it an award.","task":"Make an over-the-top announcement.","grammar":"an absolute triumph / incredibly reliable","model":"This is an absolute triumph. For once, the machine has been incredibly reliable.","follow":"Which piece of equipment deserves a medal?"}]};
const KEYS=['original','switch','wrong','drama'];
const TITLES={original:'Fill the Gap!',switch:'Meaning Switch!',wrong:'Grammar Gone Wrong!',drama:'Drama Queens!'};
const INFO={original:'Choose the right form. Your original illustrated cards appear one at a time. If you make a mistake, read the rule and try again.',switch:'Take turns speaking. Explain the situation using BOTH target structures, then ask the follow-up question.',wrong:'Take turns explaining the ridiculous situation using the grammar challenge. Tap for help if you need it.',drama:'Make the most exaggerated reaction you can — but choose NATURAL intensifier combinations! Your partner can challenge you.'};
const SAVEKEY='celia-mod3-v1';
const saved=(()=>{try{return JSON.parse(localStorage.getItem(SAVEKEY))||{}}catch(e){return {}}})();
const state={tab:KEYS.includes(saved.tab)?saved.tab:'original', indices:{original:0,switch:0,wrong:0,drama:0,...saved.indices}, correct:new Set(saved.correct||[]), hint:false, model:false, feedback:null,order:saved.order||{}};
for(const k of KEYS){if(!Array.isArray(state.order[k]) || state.order[k].length!==DATA[k].length)state.order[k]=Array.from(DATA[k].keys()); if(!Number.isInteger(state.indices[k])||state.indices[k]<0||state.indices[k]>=DATA[k].length)state.indices[k]=0;}
function persist(){try{localStorage.setItem(SAVEKEY,JSON.stringify({tab:state.tab,indices:state.indices,correct:[...state.correct],order:state.order}))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function pretty(s){return esc(s).replace('___','<span class="gap">___</span>')}
function setTab(k){if(!DATA[k])return;state.tab=k;state.hint=false;state.model=false;state.feedback=null;persist();render();window.scrollTo({top:0,behavior:'smooth'})}
function current(){const k=state.tab,i=state.indices[k],j=state.order[k][i];return {k,i,j,c:DATA[k][j]}}
function choose(val){const {k,j,c}=current();if(k!=='original')return;const ok=val===c.answer||val===c.alternative;state.feedback={val,ok};if(ok)state.correct.add(j);persist();render();}
function navigate(dir){const k=state.tab,n=DATA[k].length;state.indices[k]=(state.indices[k]+dir+n)%n;state.feedback=null;state.hint=false;state.model=false;persist();render();}
function toggleHint(){state.hint=!state.hint;render()}
function toggleModel(){state.model=!state.model;render()}
function shuffleDeck(){const k=state.tab;for(let i=state.order[k].length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[state.order[k][i],state.order[k][j]]=[state.order[k][j],state.order[k][i]]}state.indices[k]=0;state.feedback=null;state.hint=false;state.model=false;persist();render()}
function resetDeck(){if(!confirm('Start this game again from card 1?'))return;const k=state.tab;state.indices[k]=0;state.order[k]=Array.from(DATA[k].keys());if(k==='original')state.correct.clear();state.feedback=null;state.hint=false;state.model=false;persist();render()}
function render(){const {k,i,j,c}=current(),total=DATA[k].length;const tabs=document.querySelectorAll('.tab');tabs.forEach(b=>b.setAttribute('aria-selected',String(b.id==='tab-'+k)));
const progress=k==='original'?state.correct.size:i+1;
let html=`<div class="instruction"><b>${esc(TITLES[k])}</b><br>${esc(INFO[k])}</div>`;
html+=`<div class="progress-row"><span>Card ${i+1} of ${total}</span><span>${k==='original'?`${state.correct.size} correct ✓`:'Speak out loud 🎤'}</span></div><div class="progressbar" role="progressbar" aria-label="Progress" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${progress}"><div style="width:${Math.round(progress/total*100)}%"></div></div>`;
if(k==='original'){
 const locked=state.feedback?.ok;
 html+=`<article class="card" aria-label="Original grammar card ${j+1}"><div class="card-top"><span class="pill">Your original card · ${j+1}</span><span class="count">ING or INF?</span></div>`;
 // Always preserve the card image; clean high-contrast caption below is an accessibility aid, not a replacement.
 html+=`<img class="original-img" src="${esc(c.image)}" alt="Original illustrated grammar card ${j+1}: ${esc(c.text)}" onerror="this.onerror=function(){this.style.display='none'};this.src='assets/illustration-${String(j+1).padStart(2,'0')}.jpg';this.nextElementSibling.hidden=false;this.classList.add('fallback-art')">`;
 html+=`<div class="original-text" hidden>${pretty(c.text)}</div><div class="answers ${c.options.length===3?'three':''}">`;
 c.options.forEach(opt=>{let color=state.feedback?.val===opt?(state.feedback.ok?'good':'bad'):'';html+=`<button class="choice ${color}" onclick='choose(${JSON.stringify(opt)})' ${locked?'disabled':''} aria-label="Choose ${esc(opt)}">${esc(opt)}</button>`});html+='</div>';
 if(state.feedback){const ok=state.feedback.ok;const chosen=state.feedback.val;let extra='';if(ok&&c.alternative&&chosen===c.alternative)extra='<br><br><b>Also possible:</b> '+esc(c.answer)+'. Both forms work, but the emphasis changes.';else if(ok&&c.alternative)extra='<br><br><b>Also possible:</b> '+esc(c.alternative)+'. Both forms can work depending on the meaning.';
 html+=`<div class="feedback ${ok?'good':'bad'}" role="status"><strong>${ok?'✅ Exactly!':'💡 Not quite — try again!'}</strong><p>${c.explain}${extra}</p></div>`}
 html+='</article>';
}else{
 let gradient=k==='switch'?'linear-gradient(135deg,#e5f5ff,#ffe7c2)':k==='wrong'?'linear-gradient(135deg,#efe4ff,#c9f3e7)':'linear-gradient(135deg,#ffe0e5,#ffe8b6)';
 html+=`<article class="card"><div class="card-top"><span class="pill">${esc(TITLES[k])}</span><span class="count">SPEAKING CARD</span></div><div class="funbanner" style="background:${gradient}"><span aria-hidden="true">${c.emoji}</span></div><h2 class="headline">${esc(c.title)}</h2><p class="story">${esc(c.story)}</p><div class="tasklabel">Your mission</div><p class="task">${esc(c.task)}</p><div class="hint-row"><button class="secondary" onclick="toggleHint()" aria-expanded="${state.hint}">${state.hint?'🙈 Hide grammar':'💡 Grammar help'}</button><button class="secondary" onclick="toggleModel()" aria-expanded="${state.model}">${state.model?'🙈 Hide example':'👀 Model answer'}</button></div>`;
 if(state.hint)html+=`<div class="revealed"><b>Use these structures:</b><br>${esc(c.grammar)}</div>`;
 if(state.model)html+=`<div class="revealed model"><b>Possible answer:</b><br>${esc(c.model)}</div>`;
 html+=`<div class="follow"><b>Keep talking:</b> ${esc(c.follow)}</div></article>`;
}
html+=`<div class="actions"><button class="secondary" onclick="navigate(-1)">← Previous</button><button class="primary" onclick="navigate(1)">Next card →</button></div>`;
html+=`<div class="bottom"><button class="textbutton" onclick="shuffleDeck()">🔀 Shuffle cards</button><button class="textbutton" onclick="resetDeck()">↺ Start again</button></div>`;
if(k==='original'&&state.correct.size===total)html+='<div class="finish"><h2>🏆 All 15 complete!</h2><p>Excellent work. Try the three speaking games next — explaining the difference aloud is the real C1 challenge.</p></div>';
document.querySelector('#game').innerHTML=html;
}
render();
</script>
